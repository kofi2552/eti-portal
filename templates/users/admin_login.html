{% extends "base.html" %} {% load static %} {% block content %}

<div class="flex-grow flex items-center justify-center p-4 min-h-screen bg-cover bg-center bg-no-repeat"
  style="background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0, 0, 0, 0)), url('{% static 'images/login_bg.png' %}');">
  <div class="w-full max-w-sm animate-in fade-in zoom-in duration-500">
    <div class="bg-white backdrop-blur-md  border border-white/20 shadow-2xl overflow-hidden">
      <!-- HEADER -->
      <div class="pt-4 pb-2 px-8 text-center border-b-2 border-slate-100">
        <div class="w-full h-[50px] mx-auto mb-4 p-2 bg-transparent rounded-2xl flex items-center justify-center">
          <img src="{% static 'images/eti_favicon.png' %}" class="h-full w-full object-contain" />
        </div>
        <h2 class="text-xl font-extrabold text-gray-600 mb-1">
          System Admin
        </h2>
        <!-- <p class="text-slate-400 font-bold text-sm">Secure Authentication</p> -->
      </div>

      <!-- FORM -->
      <form method="post" class="px-8 pb-4 space-y-5">
        {% csrf_token %}

        <div class="space-y-2">
          <label class="text-xs font-extrabold uppercase text-slate-500 tracking-wider ml-1">
            Email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="user" class="h-5 w-5 text-slate-300 stroke-[3]"></i>
            </div>
            <input type="email" name="email" required placeholder=""
              class="block w-full pl-12 pr-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl font-bold focus:border-slate-500 focus:bg-white outline-none" />
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs font-extrabold uppercase text-slate-500 tracking-wider ml-1">
            Password
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="lock" class="h-5 w-5 text-slate-300 stroke-[3]"></i>
            </div>
            <input type="password" name="password" required
              class="block w-full pl-12 pr-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl font-bold focus:border-emerald-500 focus:bg-white outline-none" />
          </div>
        </div>

        <button type="submit"
          class="w-full bg-slate-600 border-slate-600 border-b-4 border-slate-800 text-white font-extrabold text-lg uppercase py-4 rounded-xl active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center">
          Log In
          <i data-lucide="arrow-right" class="ml-2 w-6 h-6 stroke-[3]"></i>
        </button>
      </form>
      <div class="error-block px-4 w-full mx-auto">
        {% if messages %}
        <div class="mt-2 mb-2 space-y-2 rounded text-center">
          {% for message in messages %}
          <div class="px-4 py-3 rounded text-red-700">{{ message }}</div>
          {% endfor %}
        </div>
        {% endif %}
      </div>
      <div class="pt-4" />
    </div>
  </div>
</div>

{% endblock %}
