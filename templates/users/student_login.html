{% extends "base.html" %} {% block content %} {% load static %}
<div class="flex-grow flex items-center justify-center p-4 min-h-screen bg-cover bg-center bg-no-repeat"
  style="background-image: linear-gradient(rgba(0, 0, 0, 0.116), rgba(0, 0, 0, 0)), url('{% static 'images/login_bg.png' %}');">
  <div class="w-full max-w-sm animate-in fade-in zoom-in duration-500">
    <div class="bg-white rounded-[2px] border border-white/20 shadow-2xl overflow-hidden">
      <!-- HEADER -->
      <div class="pt-4 pb-3 px-8 text-center border-b-2 border-slate-100">
        <div class="w-full h-[50px] mx-auto mb-0 p-2 bg-transparent rounded-2xl flex items-center justify-center">
          <img src="{% static 'images/eti_favicon.png' %}" class="h-full w-full object-contain" />
        </div>
        <h2 class="text-xl font-extrabold text-gray-600">Student Portal</h2>
      </div>

      <!-- FORM -->
      <form method="post" class="px-8 pb-4 space-y-5">
        {% csrf_token %}

        <div class="space-y-2">
          <label class="text-xs font-extrabold uppercase text-slate-500 tracking-wider ml-1">
            Student ID
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="user" class="h-5 w-5 text-slate-300 stroke-[3]"></i>
            </div>
            <input type="text" name="username" required placeholder="e.g., S12345678"
              class="block w-full pl-12 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-xl font-bold focus:border-brand-500 focus:bg-white outline-none" />
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs font-extrabold uppercase text-slate-500 tracking-wider ml-1">
            Student PIN
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <i data-lucide="lock" class="h-5 w-5 text-slate-300 stroke-[3]"></i>
            </div>
            <input type="password" name="password" required
              class="block w-full pl-12 pr-4 py-3.5 bg-slate-50 border-2 border-slate-200 rounded-xl font-bold focus:border-brand-500 focus:bg-white outline-none" />
          </div>
        </div>
        <div class="w-[250px] mx-auto pt-2 pb-4">
          <button type="submit"
            class="w-full bg-brand-500 border-brand-500 border-b-4 border-brand-700 text-white font-extrabold text-lg uppercase py-3 rounded-full active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center">
            Log In
            <i data-lucide="arrow-right" class="ml-2 w-6 h-6 stroke-[3]"></i>
          </button>
        </div>
      </form>
      <div class="error-block px-4 w-full mx-auto">
        {% if messages %}
        <div class="mt-1 mb-2 space-y-2 rounded text-center">
          {% for message in messages %}
          <div class="px-4 py-3 rounded text-sm text-red-700">{{ message }}</div>
          {% endfor %}
        </div>
        {% endif %}
      </div>
      <!-- <div class="px-8 pt-4 pb-8 text-center text-xs font-bold text-slate-400">
        Protected by ETI Secure Access.
      </div> -->
    </div>
  </div>
</div>

{% endblock %}
