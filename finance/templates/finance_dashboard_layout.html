{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Finance Dashboard{% endblock %}</title>
  <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="{% static 'dist/style.css' %}" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/custom.css' %}" />
  <link href="{% static 'css/vanilla-sonner.css' %}" rel="stylesheet" />
  <script src="{% static 'js/vanilla-sonner.js' %}"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: "#eef2ff",
              100: "#e0e7ff",
              500: "#6366f1",
              600: "#4f46e5",
              700: "#4338ca",
            },
            success: {
              500: "#22c55e",
              600: "#16a34a",
            },
          },
          boxShadow: {
            card: "0 10px 30px rgba(0,0,0,0.08)",
          },
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui"],
          },
        },
      },
    };
  </script>

  <style>
    /* Minimal clean sidebar width classes */
    .sidebar-expanded {
      width: 14rem;
      /* 256px */
    }

    .sidebar-collapsed {
      width: 4.5rem;
      /* 72px */
    }

    main::-webkit-scrollbar {
      width: 6px;
    }

    main::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.08);
      border-radius: 999px;
    }

    .border-c {
      border: 1px solid #b9b9b9 !important;
    }

    /* Hide text when collapsed */
    .sidebar-collapsed .nav-text,
    .sidebar-collapsed .brand-text {
      display: none;
    }

    /* Center icons better when collapsed */
    .sidebar-collapsed nav a {
      justify-content: center !important;
    }
  </style>
</head>

<body class="bg-gray-50 text-gray-700">
  <div class="flex w-screen h-screen overflow-hidden">
    <!-- LEFT SIDEBAR -->
    <aside id="sidebar" class="sidebar-expanded bg-white border-r border-gray-200 transition-all duration-300 flex-shrink-0">
      <div class="py-4 pl-6 border-b border-gray-200 font-semibold text-lg tracking-wide">
        <span class="brand-text">Finance Panel</span>
      </div>

      <nav class="p-4 space-y-2 text-sm">
        <a href="{% url 'finance_main' %}" class="flex items-center gap-3 p-2 rounded hover:bg-gray-100">
          <i data-lucide="layout-dashboard" class="w-5 h-5 flex-shrink-0"></i>
          <span class="nav-text">Overview</span>
        </a>

        <a href="{% url 'semester_fee_list' %}" class="flex items-center gap-3 p-2 rounded hover:bg-gray-100">
          <i data-lucide="landmark" class="w-5 h-5 flex-shrink-0"></i>
          <span class="nav-text">Semester Fees</span>
        </a>
        <a href="{% url 'finance_create_student_payment' %}"
          class="flex items-center gap-3 p-2 rounded hover:bg-gray-100">
          <i data-lucide="credit-card" class="w-5 h-5 flex-shrink-0"></i>
          <span class="nav-text">Fee Payment</span>
        </a>

        <a href="{% url 'finance_applications' %}" class="flex items-center gap-3 p-2 rounded hover:bg-gray-100">
          <i data-lucide="file-text" class="w-5 h-5 flex-shrink-0"></i>
          <span class="nav-text">Applications</span>
        </a>

        <a href="{% url 'finance_bank_transactions' %}" class="flex items-center gap-3 p-2 rounded hover:bg-gray-100">
          <i data-lucide="building-2" class="w-5 h-5 flex-shrink-0"></i>
          <span class="nav-text">Bank Fees</span>
        </a>

        <a href="{% url 'logout' %}" class="flex items-center gap-3 p-2 rounded hover:bg-red-50 text-red-600">
          <i data-lucide="log-out" class="w-5 h-5 flex-shrink-0"></i>
          <span class="nav-text">Logout</span>
        </a>
      </nav>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col min-h-0 min-w-0">
      <!-- TOP NAVBAR -->
      <header class="relative bg-white border-b border-gray-200 flex items-center justify-between px-6 py-4 nav-h">
        <div class="flex items-center gap-4">
          <button onclick="toggleSidebar()" class="text-gray-600 text-xl">
            ☰
          </button>
        </div>
        <!-- USER PROFILE DROPDOWN -->
        <div x-data="{ open: false }" class="nav-h">
          <button @click="open = !open" class="flex items-center space-x-3 focus:outline-none m-0 p-0">
            <!-- Avatar Circle -->
            <div
              class="bg-blue-600 text-white flex items-center justify-center rounded-full text-lg font-bold uppercase shadow"
              style="width: 28px; height: 28px; border-radius: 20px">
              <span class="text-xs">{{request.user.first_name|default:request.user.username|slice:":1"}}</span>
            </div>

            <!-- Name + Arrow -->
            <div class="hidden md:block text-left" style="width: 140px">
              <div class="w-full text-xs font-semibold text-gray-800">
                {{ request.user.get_full_name|default:request.user.username }}
              </div>
              <div class="text-gray-500" style="font-size: 8px">
                Accountant
              </div>
            </div>

            <svg xmlns="http://www.w3.org/2000/svg" class="text-gray-600 cursor-pointer" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              style="width: 16px; height: 20px">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div x-show="open" @click.away="open = false"
            class="absolute right-0 mr-2 mt-4 w-48 bg-white border border-gray-200 rounded-lg shadow-md py-2 z-50"
            x-transition>
            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
              Profile
            </a>

            <a href="{% url 'logout' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
              Logout
            </a>
          </div>
        </div>
      </header>

      <!-- CONTENT + RIGHT SIDEBAR LAYOUT -->
      <div class="flex flex-1 min-h-0 min-w-0">
        <!-- MAIN PAGE CONTENT -->
        <main class="p-6 flex-1 overflow-y-auto min-h-0 min-w-0">
          <!-- Messages -->
          {% if messages %}
          <script>
            document.addEventListener("DOMContentLoaded", function () {
              {% for message in messages %}
              {% if message.tags == 'success' %}
              toast.success("{{ message|escapejs }}");
              {% elif message.tags == 'error' or message.tags == 'danger' %}
              toast.error("{{ message|escapejs }}");
              {% elif message.tags == 'warning' %}
              toast.warning("{{ message|escapejs }}");
              {% elif message.tags == 'info' %}
              toast.info("{{ message|escapejs }}");
              {% else %}
              toast("{{ message|escapejs }}");
              {% endif %}
              {% endfor %}
            });
          </script>
          {% endif %}
          <!-- .................... -->
          {% block content %}
          <!-- .................... -->
          {% endblock %}
          <!-- .................... -->
        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="w-52 bg-gray-50 border-l border-gray-200 hidden lg:block p-4 flex-shrink-0">
          <h3 class="font-semibold mb-3 text-sm">Quick Actions</h3>

          <ul class="space-y-2 text-sm">
            <li>
              <a href="#" class="text-blue-600 hover:underline">Generate Report</a>
            </li>
            <!-- <li>
              <a href="#" class="text-blue-600 hover:underline">View Logs</a>
            </li>
            <li>
              <a href="#" class="text-blue-600 hover:underline">System Settings</a>
            </li> -->
          </ul>
        </aside>
      </div>
    </div>
  </div>

  <ol id="sonner-toast-container" position="bottom-right" rich-colors="true"></ol>

  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

  <!-- SIDEBAR TOGGLE SCRIPT -->
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("sidebar-collapsed");
      sidebar.classList.toggle("sidebar-expanded");
    }
  </script>

  <script>
    lucide.createIcons();
  </script>
</body>

</html>
